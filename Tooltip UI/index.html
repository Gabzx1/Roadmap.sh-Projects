<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Gabzx1" />
    <title>Tooltip UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <nav class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#" class="nav-link">
              <svg class="nav-icon" viewBox="0 0 21 20">
                <use href="icons.svg#home"></use>
              </svg>
              <span class="tooltip tooltip__home">Home</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <svg class="nav-icon nav-icon__bigger" viewBox="0 0 32 32">
                <use href="icons.svg#projects"></use>
              </svg>
              <span class="tooltip tooltip__projects">Projects</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <svg class="nav-icon nav-icon__bigger" viewBox="0 0 24 24">
                <use href="icons.svg#blog"></use>
              </svg>
              <span class="tooltip tooltip__blog">Blog</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <svg class="nav-icon" viewBox="0 -3.5 21 21">
                <use href="icons.svg#setting"></use>
              </svg>
              <span class="tooltip tooltip__settings">Settings</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link">
              <svg class="nav-icon" viewBox="0 0 20 20">
                <use href="icons.svg#user"></use>
              </svg>
              <span class="tooltip tooltip__profile">Profile</span></a
            >
          </li>
        </ul>
      </nav>
    </main>
  </body>
</html>
