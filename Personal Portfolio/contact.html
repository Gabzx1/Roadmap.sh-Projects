    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />

  <body>
    <header class="header">
      <div class="nav-wrapper">
        <nav class="nav" aria-label="Main navigation">
          <h2 class="logo">Gabzx1</h2>
          <ul class="nav-list">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
            <li class="nav-item"><a href="articles.html" class="nav-link">Articles</a></li>
            <li class="nav-item"><a href="contact.html" class="nav-link">Contact</a></li>
          </ul>
        </nav>
      </div>
      <div class="hero">
        <h1 class="hero-title">Contact Us</h1>
        <p>Please fill in the form below to get in touch with us.</p>
      </div>
    </header>
    <main class="main">
      <section class="form-wrapper">
        <form class="form">
          <input type="text" placeholder="First Name" id="Fname" required class="form-input" minlength="2" />
          <input type="text" placeholder="Last Name" id="Lname" required class="form-input" minlength="2" />
          <input type="email" placeholder="Email address" id="email" required class="form-input" />
          <input type="number" placeholder="Phone Number" id="phone" required class="form-input" minlength="14" />
          <textarea
            placeholder="Write your Message"
            id="message"
            rows="4"
            required
            class="form-input form-textarea"
            maxlength="500"
          ></textarea>
          <div class="form-bottom">
            <div class="checkbox-group">
              <input type="checkbox" class="form-check" required /><span
                >I've read and agree with <a href="#" class="form-link">Terms of Service</a> and
                <a href="#" class="form-link">Privacy Policy</a> Submit</span
              >
            </div>
            <button type="submit" class="form-btn">Submit</button>
          </div>
        </form>
      </section>
    </main>
    <footer class="footer">
      <h3 class="footer-title">© 2026 Gabriel. All rights reserved.</h3>
    </footer>
  </body>
</html>
