<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datepicker</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="author" content="Gabzx1" />
</head>
<body>
  <div class="datepicker">
    <div class="datepicker__input-wrapper">
      <input type="text" class="datepicker__input" value="dd / mm / yyyy" readonly />
      <button class="datepicker__toggle-btn">
        <img src="icon/calendar.svg" alt="calendar icon" class="datepicker__icon" />
      </button>
    </div>

    <div class="datepicker__calendar">
      <div class="datepicker__calendar-header">
        <h3 class="datepicker__month">December 2025</h3>
        <button class="datepicker__nav-btn">
          <img src="icon/left.svg" alt="left arrow" class="datepicker__icon" />
        </button>
        <button class="datepicker__nav-btn">
          <img src="icon/right.svg" alt="right arrow" class="datepicker__icon" />
        </button>
      </div>

      <div class="datepicker__weekdays">
        <span class="datepicker__weekday">Sun</span>
        <span class="datepicker__weekday">Mon</span>
        <span class="datepicker__weekday">Tue</span>
        <span class="datepicker__weekday">Wed</span>
        <span class="datepicker__weekday">Thu</span>
        <span class="datepicker__weekday">Fri</span>
        <span class="datepicker__weekday">Sat</span>
      </div>

      <div class="datepicker__days">
        <span class="datepicker__day">27</span>
        <span class="datepicker__day">28</span>
        <span class="datepicker__day">29</span>
        <span class="datepicker__day">30</span>
        <span class="datepicker__day">1</span>
        <span class="datepicker__day">2</span>
        <span class="datepicker__day">3</span>
        <span class="datepicker__day">4</span>
        <span class="datepicker__day">5</span>
        <span class="datepicker__day">6</span>
        <span class="datepicker__day">7</span>
        <span class="datepicker__day">8</span>
        <span class="datepicker__day">9</span>
        <span class="datepicker__day">10</span>
        <span class="datepicker__day">11</span>
        <span class="datepicker__day">12</span>
        <span class="datepicker__day">13</span>
        <span class="datepicker__day">14</span>
        <span class="datepicker__day">15</span>
        <span class="datepicker__day">16</span>
        <span class="datepicker__day">17</span>
        <span class="datepicker__day">18</span>
        <span class="datepicker__day">19</span>
        <span class="datepicker__day">20</span>
        <span class="datepicker__day">21</span>
        <span class="datepicker__day">22</span>
        <span class="datepicker__day">23</span>
        <span class="datepicker__day">24</span>
        <span class="datepicker__day">25</span>
        <span class="datepicker__day">26</span>
        <span class="datepicker__day">27</span>
        <span class="datepicker__day">28</span>
        <span class="datepicker__day">29</span>
        <span class="datepicker__day">30</span>
        <span class="datepicker__day">31</span>
      </div>
    </div>
  </div>
</body>
</html>
