<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Gabzx1" />
  <title>Tooltip UI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <nav class="nav">
      <ul class="nav__list">
        <li class="nav__item">
          <a href="#" class="nav__link">
            <svg class="nav__icon" viewBox="0 0 21 20">
              <use href="icons.svg#home"></use>
            </svg>
            <span class="nav__tooltip nav__tooltip--home">Home</span>
          </a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">
            <svg class="nav__icon nav__icon--bigger" viewBox="0 0 32 32">
              <use href="icons.svg#projects"></use>
            </svg>
            <span class="nav__tooltip nav__tooltip--projects">Projects</span>
          </a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">
            <svg class="nav__icon nav__icon--bigger" viewBox="0 0 24 24">
              <use href="icons.svg#blog"></use>
            </svg>
            <span class="nav__tooltip nav__tooltip--blog">Blog</span>
          </a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">
            <svg class="nav__icon" viewBox="0 -3.5 21 21">
              <use href="icons.svg#setting"></use>
            </svg>
            <span class="nav__tooltip nav__tooltip--settings">Settings</span>
          </a>
        </li>
        <li class="nav__item">
          <a href="#" class="nav__link">
            <svg class="nav__icon" viewBox="0 0 20 20">
              <use href="icons.svg#user"></use>
            </svg>
            <span class="nav__tooltip nav__tooltip--profile">Profile</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
