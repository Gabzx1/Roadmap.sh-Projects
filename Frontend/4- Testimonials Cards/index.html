<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonial Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="main">
      <section class="layout">
        <figure class="testimonial">
          <blockquote class="testimonial__card testimonial__card--arrow">
            <p>
              I have been solving all the project ideas on roadmap.sh and I am surprised how far I have come from where
              I started.
            </p>
            <p>Highly recommended!</p>
          </blockquote>
          <figcaption class="testimonial__caption">
            <a href="https://www.youtube.com/midudev" target="_blank" class="testimonial__link"
              ><img src="src/img/Midu.webp" alt="Midudev" class="testimonial__img"
            /></a>
            <div class="testimonial__profile">
              <p class="testimonial__name">Midudev</p>
              <p>Senior Fullstack Developer</p>
            </div>
          </figcaption>
        </figure>

        <figure class="testimonial testimonial--white">
          <blockquote class="testimonial__card testimonial__card--white">
            <p>
              Since starting my career in 2021, I have only followed one resource, roadmap.sh, it truly helped me go
              from 0 to having a job and changing the financial trajectory of my family
            </p>
          </blockquote>
          <figcaption class="testimonial__caption">
            <a href="https://youtube.com/@nategentile7?si=fjUuZhLWHRQJsBhG" target="_blank" class="testimonial__link"
              ><img src="src/img/Nate.webp" alt="Nate" class="testimonial__img"
            /></a>
            <div class="testimonial__profile">
              <p class="testimonial__name">Nate Gentile</p>
              <p>Senior Software Engineer</p>
            </div>
          </figcaption>
        </figure>

        <figure class="testimonial testimonial--full testimonial--2col">
          <a
            href="https://www.youtube.com/channel/UCnxubBCPlg0hHdZw_UehrTw"
            class="testimonial__link testimonial__link--width"
            ><img src="src/img/Varo.webp" alt="Varo" class="testimonial__img testimonial__img--big"
          /></a>
          <div class="testimonial__card">
            <div class="testimonial__rating">
              <svg class="testimonial__icon" viewBox="0 0 32 32">
                <use href="src/img/icon/icons.svg#star"></use>
              </svg>
              <svg class="testimonial__icon" viewBox="0 0 32 32">
                <use href="src/img/icon/icons.svg#star"></use>
              </svg>
              <svg class="testimonial__icon" viewBox="0 0 32 32">
                <use href="src/img/icon/icons.svg#star"></use>
              </svg>
              <svg class="testimonial__icon" viewBox="0 0 32 32">
                <use href="src/img/icon/icons.svg#star"></use>
              </svg>
              <svg class="testimonial__icon" viewBox="0 0 32 32">
                <use href="src/img/icon/icons.svg#star"></use>
              </svg>
            </div>
            <figcaption class="testimonial__caption">
              <div class="testimonial__profile">
                <p class="testimonial__name testimonial__name--big">El Rincón de Varo</p>
                <p>Web Developer Technician</p>
              </div>
            </figcaption>
            <blockquote>
              <p>
                I find myself recommending roadmap.sh to all the internees or junior developers. It's a great way to
                skill up and grow in your career.
              </p>
            </blockquote>
          </div>
        </figure>

        <figure class="testimonial testimonial--full testimonial--white">
          <blockquote class="testimonial__card testimonial__card--white testimonial__card--2col">
            <p>
              roadmap.sh is an incredible resource. I was fortunate to discover it during my university days in 2018.
              Back then, it was just a single repository with three images. It's amazing to see how much impact it has
              had on millions of lives since then.
            </p>
          </blockquote>
          <figcaption class="testimonial__caption testimonial__caption--2col">
            <a href="https://youtube.com/@nategentile7?si=fjUuZhLWHRQJsBhG" target="_blank" class="testimonial__link"
              ><img src="src/img/Nate.webp" alt="Nate" class="testimonial__img testimonial__img--op"
            /></a>
            <div class="testimonial__profile testimonial__profile--select">
              <a href="https://www.youtube.com/midudev" target="_blank" class="testimonial__link"
                ><img src="src/img/Midu.webp" alt="Midudev" class="testimonial__img"
              /></a>
              <p class="testimonial__name">Midudev</p>
            </div>
            <a href="https://www.youtube.com/channel/UCnxubBCPlg0hHdZw_UehrTw" class="testimonial__link"
              ><img src="src/img/Varo.webp" alt="Varo" class="testimonial__img testimonial__img--op"
            /></a>
          </figcaption>
        </figure>
      </section>
    </main>
  </body>
</html>
