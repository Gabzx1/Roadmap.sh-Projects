<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Accesible form UI" />
  <title>Form UI</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="author" content="Gabzx1" />
</head>
<body>
  <main>
    <div class="form-card">
      <form class="form-card__form">
        <div class="form-card__group">
          <label for="name" class="form-card__label">Full Name</label>
          <input type="text" class="form-card__input" placeholder="e.g. Gabriel Reyes" id="name" required />
        </div>

        <div class="form-card__group">
          <label for="email" class="form-card__label">Email</label>
          <input
            type="email"
            class="form-card__input form-card__input--email"
            id="email"
            placeholder="example@hotmail.com"
            required
            aria-describedby="email-error"
          />
          <span class="form-card__error" id="email-error">Please enter a valid email</span>
        </div>

        <div class="form-card__group">
          <label for="password" class="form-card__label">Enter Password</label>
          <input
            type="password"
            class="form-card__input"
            id="password"
            placeholder="xxxxxxxx"
            required
            aria-describedby="error-msg"
            minlength="6"
          />
          <button class="form-card__toggle-password" type="button" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="currentColor">
              <path
                d="M14 5.25c-5.83 0-10.81 3.63-12.83 8.75 2.02 5.12 7 8.75 12.83 8.75s10.81-3.63 12.83-8.75c-2.02-5.12-7-8.75-12.83-8.75zm0 14.58c-3.22 0-5.83-2.61-5.83-5.83s2.61-5.83 5.83-5.83 5.83 2.61 5.83 5.83-2.61 5.83-5.83 5.83zm0-9.33c-1.94 0-3.5 1.56-3.5 3.5s1.56 3.5 3.5 3.5 3.5-1.56 3.5-3.5-1.56-3.5-3.5-3.5z"
              />
            </svg>
          </button>
        </div>

        <div class="form-card__group">
          <label for="conf-psw" class="form-card__label">Confirm Password</label>
          <input
            type="password"
            class="form-card__input"
            id="conf-psw"
            placeholder="xxxxxxxx"
            required
            aria-describedby="error-msg"
            minlength="6"
          />
          <button class="form-card__toggle-password" type="button" aria-label="Show password">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="currentColor">
              <path
                d="M14 5.25c-5.83 0-10.81 3.63-12.83 8.75 2.02 5.12 7 8.75 12.83 8.75s10.81-3.63 12.83-8.75c-2.02-5.12-7-8.75-12.83-8.75zm0 14.58c-3.22 0-5.83-2.61-5.83-5.83s2.61-5.83 5.83-5.83 5.83 2.61 5.83 5.83-2.61 5.83-5.83 5.83zm0-9.33c-1.94 0-3.5 1.56-3.5 3.5s1.56 3.5 3.5 3.5 3.5-1.56 3.5-3.5-1.56-3.5-3.5-3.5z"
              />
            </svg>
          </button>
        </div>

        <button type="submit" class="form-card__submit">Update Profile</button>
      </form>

      <div class="form-card__progress">
        <div class="form-card__circle" role="progressbar" aria-label="progressbar">
          <span>65%</span>
        </div>
        <h3 class="form-card__progress-title">Profile Completeness</h3>
        <ul class="form-card__task-list">
          <li class="form-card__task-item">Create Account</li>
          <li class="form-card__task-item">Update Roadmap Progress</li>
          <li class="form-card__task-item">Setup Public Profile</li>
          <li class="form-card__task-item">Complete your first project</li>
          <li class="form-card__task-item">Invite your friends</li>
        </ul>
      </div>
    </div>
  </main>
</body>
</html>
