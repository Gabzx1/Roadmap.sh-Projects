<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Accesible form UI" />
    <title>Form UI</title>
    <link rel="stylesheet" href="styles.css" />
    <meta name="author" content="Gabzx1" />
  </head>
  <body>
    <main>
      <div class="form-container">
        <form class="form">
          <div class="form-group">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-input" placeholder="e.g. Gabriel Reyes" id="name" required />
          </div>
          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-input form-input__email"
              id="email"
              placeholder="example@hotmail.com"
              required
              aria-describedby="email-error"
            />
            <span class="error" id="email-error">Please enter a valid email</span>
          </div>
          <div class="form-group">
            <label for="password" class="form-label">Enter Password</label>
            <input
              type="password"
              class="form-input"
              id="password"
              placeholder="xxxxxxxx"
              required
              aria-describedby="error-msg"
              minlength="6"
            />
            <button class="toggle-psw-btn" type="button" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="currentColor">
                <path
                  d="M14 5.25c-5.83 0-10.81 3.63-12.83 8.75 2.02 5.12 7 8.75 12.83 8.75s10.81-3.63 12.83-8.75c-2.02-5.12-7-8.75-12.83-8.75zm0 14.58c-3.22 0-5.83-2.61-5.83-5.83s2.61-5.83 5.83-5.83 5.83 2.61 5.83 5.83-2.61 5.83-5.83 5.83zm0-9.33c-1.94 0-3.5 1.56-3.5 3.5s1.56 3.5 3.5 3.5 3.5-1.56 3.5-3.5-1.56-3.5-3.5-3.5z"
                />
              </svg>
            </button>
          </div>

          <div class="form-group">
            <label for="conf-psw" class="form-label">Confirm Password</label>
            <input
              type="password"
              class="form-input"
              id="conf-psw"
              placeholder="xxxxxxxx"
              required
              aria-describedby="error-msg"
              minlength="6"
            />
            <button class="toggle-psw-btn" type="button" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" fill="currentColor">
                <path
                  d="M14 5.25c-5.83 0-10.81 3.63-12.83 8.75 2.02 5.12 7 8.75 12.83 8.75s10.81-3.63 12.83-8.75c-2.02-5.12-7-8.75-12.83-8.75zm0 14.58c-3.22 0-5.83-2.61-5.83-5.83s2.61-5.83 5.83-5.83 5.83 2.61 5.83 5.83-2.61 5.83-5.83 5.83zm0-9.33c-1.94 0-3.5 1.56-3.5 3.5s1.56 3.5 3.5 3.5 3.5-1.56 3.5-3.5-1.56-3.5-3.5-3.5z"
                />
              </svg>
            </button>
          </div>
          <button type="submit" class="submit-btn">Update Profile</button>
        </form>
        <div class="progress-wrapper">
          <div class="circle-progress" role="progressbar" aria-label="progressbar">
            <span>65%</span>
          </div>
          <h3 class="title">Profile Completeness</h3>
          <ul class="task-list">
            <li class="list-item">Create Account</li>
            <li class="list-item">Update Roadmap Progress</li>
            <li class="list-item">Setup Public Profile</li>
            <li class="list-item">Complete your first project</li>
            <li class="list-item">Invite your friends</li>
          </ul>
        </div>
      </div>
    </main>
  </body>
</html>
